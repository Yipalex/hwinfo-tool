<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Microsoft YaHei UI, PingFang SC, Segoe UI, sans-serif">
  <!-- window -->
  <rect width="760" height="560" fill="#ffffff" stroke="#c8c8c8"/>
  <!-- title bar -->
  <rect width="760" height="34" fill="#f3f3f3"/>
  <line x1="0" y1="34" x2="760" y2="34" stroke="#dcdcdc"/>
  <circle cx="18" cy="17" r="6" fill="#4a90d9"/>
  <text x="32" y="21" font-size="13" fill="#333333">硬件检测工具 v1.5.0</text>
  <!-- toolbar -->
  <rect x="12" y="44" width="78" height="26" rx="4" fill="#ffffff" stroke="#adadad"/>
  <text x="51" y="61" font-size="12" fill="#222222" text-anchor="middle">重新检测</text>
  <rect x="98" y="44" width="90" height="26" rx="4" fill="#ffffff" stroke="#adadad"/>
