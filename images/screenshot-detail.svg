  <rect x="196" y="44" width="78" height="26" rx="4" fill="#ffffff" stroke="#adadad"/>
  <text x="235" y="61" font-size="12" fill="#222222" text-anchor="middle">导出报告</text>
  <text x="748" y="61" font-size="12" fill="#666666" text-anchor="end">管理员权限</text>
  <!-- tab bar -->
  <line x1="8" y1="102" x2="752" y2="102" stroke="#c8c8c8"/>
  <text x="60" y="96" font-size="12" fill="#777777" text-anchor="middle">简约概览</text>
  <rect x="108" y="80" width="96" height="23" fill="#ffffff" stroke="#c8c8c8"/>
  <line x1="108" y1="102" x2="204" y2="102" stroke="#ffffff" stroke-width="2"/>
  <rect x="108" y="80" width="96" height="3" fill="#4a90d9"/>
  <text x="156" y="96" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">详细参数</text>
  <!-- tree header -->
  <rect x="12" y="110" width="736" height="24" fill="#f5f5f5"/>
  <line x1="12" y1="134" x2="748" y2="134" stroke="#e0e0e0"/>
  <text x="24" y="126" font-size="12" fill="#555555">项目</text>
  <line x1="272" y1="110" x2="272" y2="530" stroke="#ececec"/>
  <text x="284" y="126" font-size="12" fill="#555555">值</text>
  <!-- tree rows -->
  <g font-size="12.5">
    <text x="24" y="156" font-weight="bold" fill="#1a1a1a">▾ 计算机 / 操作系统</text>
    <text x="44" y="180" fill="#333333">计算机名称</text>
    <text x="284" y="180" fill="#333333">DESKTOP-G2AEE8D</text>
    <text x="44" y="204" fill="#333333">操作系统</text>
    <text x="284" y="204" fill="#333333">Microsoft Windows 11 专业版（内部版本 28000，64 位）</text>
    <text x="24" y="228" font-weight="bold" fill="#1a1a1a">▾ 处理器 (CPU)</text>
    <text x="44" y="252" fill="#333333">型号</text>
    <text x="284" y="252" fill="#333333">AMD Ryzen 5 5600GT with Radeon Graphics</text>
    <text x="44" y="276" fill="#333333">核心 / 线程</text>
    <text x="284" y="276" fill="#333333">6 / 12</text>
    <text x="44" y="300" fill="#333333">最大主频</text>
    <text x="284" y="300" fill="#333333">3600 MHz</text>
    <text x="24" y="324" font-weight="bold" fill="#1a1a1a">▾ 显示器</text>
    <text x="44" y="348" fill="#333333">显示器 1</text>
    <text x="284" y="348" fill="#333333">27B30H</text>
    <text x="44" y="372" fill="#333333">品牌</text>
    <text x="284" y="372" fill="#333333">冠捷 AOC</text>
    <text x="44" y="396" fill="#333333">状态</text>
    <text x="284" y="396" fill="#333333">未激活（历史记录，或远程会话下物理显示器休眠）</text>
    <text x="44" y="420" fill="#333333">出厂日期</text>
    <text x="284" y="420" fill="#333333">2026 年第 29 周</text>
    <text x="24" y="444" fill="#555555">▸ 主板 / BIOS</text>
    <text x="24" y="468" fill="#555555">▸ 内存</text>
    <text x="24" y="492" fill="#555555">▸ 显卡 (GPU)</text>
    <text x="24" y="516" fill="#555555">▸ 硬盘</text>
  </g>
  <!-- status bar -->
  <rect x="0" y="532" width="760" height="28" fill="#f7f7f7"/>
  <line x1="0" y1="532" x2="760" y2="532" stroke="#e0e0e0"/>
  <text x="12" y="550" font-size="11.5" fill="#555555">检测完成：2026-10-31 10:55:29</text>
</svg>
